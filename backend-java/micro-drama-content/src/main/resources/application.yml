spring:
  application:
    name: micro-drama-content
  profiles:
    active: local
  config:
    additional-location: optional:file:/config/application.yml,optional:file:./config/application.yml
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}

# PostgreSQL UUID 列（drama.id、episode.id 等）需 TypeHandler
mybatis-plus:
  type-handlers-package: com.series.common.typehandler

server:
  port: 0

grpc:
  server:
    port: 9091

# 与 admin 对齐；线上由 Consul 覆盖
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-change-me}
  access-expire: ${JWT_ACCESS_EXPIRE:7200000}

auth:
  gateway:
    mode: ${AUTH_GATEWAY_MODE:off}

video-service:
  base-url: ${VIDEO_SERVICE_BASE_URL:http://micro-drama-video:8080}

management:
  health:
    grpc:
      enabled: false
