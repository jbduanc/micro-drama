spring:
  application:
    name: micro-drama-payment
  profiles:
    active: local
  config:
    additional-location: optional:file:/config/application.yml,optional:file:./config/application.yml
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-change-me}
  access-expire: ${JWT_ACCESS_EXPIRE:7200000}

auth:
  gateway:
    mode: ${AUTH_GATEWAY_MODE:off}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

grpc:
  client:
    chain-service:
      address: ${CHAIN_GRPC_ADDRESS:static://micro-drama-chain:9092}
      negotiation-type: plaintext

management:
  health:
    grpc:
      enabled: false
