_format_version: "3.0"

# 全局 CORS：OPTIONS 由 Kong 直接响应（preflight_continue: false），避免预检进入 JWT pre-function
plugins:
  - name: cors
    config:
      origins:
        - https://admin.dramadjbo.com
        - https://www.dramadjbo.com
        - https://dramadjbo.com
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
        - Origin
        - X-Requested-With
      credentials: true
      max_age: 3600
      preflight_continue: false

# 生产 compose 服务名：backend-admin / backend-user / …（app-network）
# Java 服务配置了 server.servlet.context-path，Kong 须 strip_path: false，保留 /admin-api 等前缀
# Go video 无 context-path，strip_path: true，/video-api 前缀剥离后转发 /v1/video/...
# JWT 校验用 Kong 内置 resty.openssl（HS256），无需 lua-resty-jwt 自定义镜像
# JWT_SECRET 环境变量须与各服务 /config 内 jwt.secret 一致（勿写入仓库）

services:
  - name: backend-admin
    url: http://backend-admin:6001
    routes:
      - name: admin-oauth-public
        paths:
          - /admin-api/oauth2/authorize-url
          - /admin-api/oauth2/login/google
        strip_path: false
        methods: [GET, POST, OPTIONS]
      - name: admin-actuator
        paths: [/admin-api/actuator]
        strip_path: false
      - name: admin-api-protected
        paths: [/admin-api]
        strip_path: false
        plugins:
          - name: pre-function
            config:
              access:
                - |
                  if kong.request.get_method() == "OPTIONS" then
                    return
                  end
                  local cjson = require("cjson")
                  local function b64url_decode(s)
                    if not s then return nil end
                    s = s:gsub("-", "+"):gsub("_", "/")
                    local pad = #s % 4
                    if pad > 0 then s = s .. string.rep("=", 4 - pad) end
                    return ngx.decode_base64(s)
                  end
                  local function verify_hs256_jwt(token, secret)
                    local h_b64, p_b64, s_b64 = token:match("^([^%.]+)%.([^%.]+)%.([^%.]+)$")
                    if not h_b64 then return nil, "malformed" end
                    local header_raw = b64url_decode(h_b64)
                    local payload_raw = b64url_decode(p_b64)
                    if not header_raw or not payload_raw then return nil, "b64" end
                    local header = cjson.decode(header_raw)
                    local payload = cjson.decode(payload_raw)
                    if not header or not payload or header.alg ~= "HS256" then return nil, "alg" end
                    local signing_input = h_b64 .. "." .. p_b64
                    local hmac_mod = require("resty.openssl.hmac")
                    local h, err = hmac_mod.new(secret, "sha256")
                    if not h then return nil, "hmac" end
                    local mac, ferr = h:final(signing_input)
                    local sig = b64url_decode(s_b64)
                    if not mac or not sig or #mac ~= #sig or mac ~= sig then return nil, "sig" end
                    return payload
                  end
                  local auth = kong.request.get_header("Authorization")
                  local token = auth and auth:match("^[Bb]earer%s+(.+)$")
                  if token then token = token:match("^%s*(.-)%s*$") end
                  if not token or token == "" then
                    return kong.response.exit(401, { message = "未提供有效令牌" })
                  end
                  local secret = os.getenv and os.getenv("JWT_SECRET")
                  if not secret or secret == "" then
                    return kong.response.exit(500, { message = "JWT_SECRET not configured; set KONG_UNTRUSTED_LUA=on and KONG_NGINX_MAIN_ENV=JWT_SECRET" })
                  end
                  local payload, verr = verify_hs256_jwt(token, secret)
                  if not payload then
                    return kong.response.exit(401, { message = "令牌无效或已过期", reason = verr or "unknown" })
                  end
                  if payload.exp and payload.exp < ngx.time() then
                    return kong.response.exit(401, { message = "令牌已过期" })
                  end
                  local aud = payload.aud or "admin"
                  if aud ~= "admin" then
                    return kong.response.exit(403, { message = "需要管理端令牌" })
                  end
                  kong.service.request.set_header("X-Auth-Subject", payload.sub or "")
                  kong.service.request.set_header("X-Auth-Audience", aud)

