_format_version: "3.0"

# 生产 compose 服务名：backend-admin / backend-user / …（app-network）
# Java 服务配置了 server.servlet.context-path，Kong 须 strip_path: false，保留 /admin-api 等前缀
# Go video 无 context-path，strip_path: true，/video-api 前缀剥离后转发 /v1/video/...
# JWT_SECRET 环境变量须与各服务 /config 内 jwt.secret 一致（勿写入仓库）

services:
  - name: backend-admin
    url: http://backend-admin:6001
    routes:
      - name: admin-oauth-public
        paths:
          - /admin-api/oauth2/authorize-url
          - /admin-api/oauth2/login/google
        strip_path: false
        methods: [GET, POST, OPTIONS]
      - name: admin-actuator
        paths: [/admin-api/actuator]
        strip_path: false
      - name: admin-api-protected
        paths: [/admin-api]
        strip_path: false
        plugins:
          - name: pre-function
            config:
              access:
                - |
                  local jwt = require("resty.jwt")
                  local auth = kong.request.get_header("Authorization")
                  if not auth or not auth:find("^Bearer ") then
                    return kong.response.exit(401, { message = "未提供有效令牌" })
                  end
                  local secret = os.getenv("JWT_SECRET")
                  if not secret or secret == "" then
                    return kong.response.exit(500, { message = "JWT_SECRET not configured" })
                  end
                  local token = auth:sub(8)
                  local jwt_obj = jwt:verify(secret, token)
                  if not jwt_obj or not jwt_obj.valid then
                    return kong.response.exit(401, { message = "令牌无效或已过期" })
                  end
                  local payload = jwt_obj.payload
                  if payload.exp and payload.exp < ngx.time() then
                    return kong.response.exit(401, { message = "令牌已过期" })
                  end
                  local aud = payload.aud or "admin"
                  if aud ~= "admin" then
                    return kong.response.exit(403, { message = "需要管理端令牌" })
                  end
                  kong.service.request.set_header("X-Auth-Subject", payload.sub or "")
                  kong.service.request.set_header("X-Auth-Audience", aud)

