  build-frontend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_frontend == true) ||
      (github.event_name == 'push' && (needs.changes.outputs.frontend_admin == 'true' || needs.changes.outputs.frontend_mini_app == 'true'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend-admin
            dir: frontend/micro-drama-admin
            deploy_service: frontend-admin
            changed_output: frontend_admin
            package_manager: pnpm
          - name: frontend-mini-app
            dir: frontend/micro-drama-mini-app
            deploy_service: frontend-mini-app
            changed_output: frontend_mini_app
            package_manager: npm
    env:
      HUSKY: "0"
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 判定是否需要构建本工程
        id: gate
        run: |
          BUILD=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD=true
          elif [ "${{ matrix.changed_output }}" = "frontend_admin" ] && [ "${{ needs.changes.outputs.frontend_admin }}" = "true" ]; then
            BUILD=true
          elif [ "${{ matrix.changed_output }}" = "frontend_mini_app" ] && [ "${{ needs.changes.outputs.frontend_mini_app }}" = "true" ]; then
            BUILD=true
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          if [ "$BUILD" = "false" ]; then
            echo "Skip ${{ matrix.name }}: no changes for this frontend project."
          fi

      - name: 安装 pnpm
        if: steps.gate.outputs.build == 'true' && matrix.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ matrix.package_manager }}
          cache-dependency-path: ${{ matrix.package_manager == 'pnpm' && format('{0}/pnpm-lock.yaml', matrix.dir) || format('{0}/package-lock.json', matrix.dir) }}

      - name: 依赖缓存（pnpm store）
        if: steps.gate.outputs.build == 'true' && matrix.package_manager == 'pnpm'
        uses: actions/cache@v4
        with:
          path: /home/runner/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles(format('{0}/pnpm-lock.yaml', matrix.dir)) }}
          restore-keys: |
            pnpm-store-

      - name: 前端编译 (pnpm)
        if: steps.gate.outputs.build == 'true' && matrix.package_manager == 'pnpm'
        working-directory: ${{ matrix.dir }}
        run: |
          set -e
          test -f package.json || { echo "::error::$PWD 下无 package.json"; ls -la; exit 1; }
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 前端编译 (npm)
        if: steps.gate.outputs.build == 'true' && matrix.package_manager == 'npm'
        working-directory: ${{ matrix.dir }}
        env:
          NEXT_PUBLIC_CONTENT_API_BASE: https://api.dramadjbo.com/content-api
          NEXT_PUBLIC_VIDEO_API_BASE: https://api.dramadjbo.com/video-api
          NEXT_PUBLIC_PAYMENT_API_BASE: https://api.dramadjbo.com/payment-api
        run: |
          set -e
          test -f package.json || { echo "::error::$PWD 下无 package.json"; ls -la; exit 1; }
          npm ci
          npm run build
          test -d .next/standalone || { echo "::error::missing .next/standalone after build"; ls -la .next || true; exit 1; }
          test -d .next/static || { echo "::error::missing .next/static after build"; ls -la .next || true; exit 1; }

      - name: 配置 Docker 私服
        if: steps.gate.outputs.build == 'true'
        run: |
          echo "{\"insecure-registries\": [\"${{ env.NEXUS_DOCKER_HOST }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: 规范化 Docker 仓库地址
        if: steps.gate.outputs.build == 'true'
        run: |
          set -e
          echo "Using registry ${{ env.NEXUS_DOCKER_HOST }}"

      - name: 登录 Nexus Docker
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_DOCKER_HOST }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Docker build & push
        if: steps.gate.outputs.build == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'latest' }}"
          REG="${{ env.NEXUS_DOCKER_HOST }}"
          IMG="frontend-$(basename "${{ matrix.dir }}")"
          docker build -t "${REG}/${IMG}:${TAG}" .
          docker push "${REG}/${IMG}:${TAG}"

      - name: Webhook 部署
        if: |
          steps.gate.outputs.build == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.skip_deploy_webhook == false)
        continue-on-error: true
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -e
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w "%{http_code}" -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
               -H "X-Deploy-Token: $DEPLOY_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{"services":"${{ matrix.deploy_service }}"}')
          echo "Deploy webhook HTTP $code — response:"
          cat "$tmp" || true
          rm -f "$tmp"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook OK for ${{ matrix.deploy_service }}"
            exit 0
          fi
          echo "::warning::Deploy webhook failed for ${{ matrix.deploy_service }}（镜像已推送）。请核对部署端是否识别 services 名称并查看 deploy 服务日志。"
          exit 1
