# 镜像名：registry/backend-<子目录名>、registry/frontend-<子目录名>（子目录 = 工程文件夹名，如 micro-drama-admin） 
# Monorepo：按服务拆 job；push 走 paths-filter；手动运行按勾选项
name: 短剧项目 CI/CD (Monorepo Multi-Service)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_admin:
        description: 构建 backend-java/micro-drama-admin（镜像 backend-micro-drama-admin）
        type: boolean
        default: true
      build_user:
        description: 构建 backend-java/micro-drama-user（镜像 backend-micro-drama-user）
        type: boolean
        default: true
      build_content:
        description: 构建 backend-java/micro-drama-content（镜像 backend-micro-drama-content）
        type: boolean
        default: true
      build_transcoder:
        description: 构建 backend-go/micro-drama-transcoder（镜像 backend-micro-drama-transcoder）
        type: boolean
        default: true
      build_video:
        description: 构建 backend-go/micro-drama-video（镜像 backend-micro-drama-video）
        type: boolean
        default: true
      build_chain:
        description: 构建 backend-go/micro-drama-chain（镜像 backend-micro-drama-chain）
        type: boolean
        default: true
      build_payment:
        description: 构建 backend-java/micro-drama-payment（镜像 backend-micro-drama-payment）
        type: boolean
        default: true
      build_gateway_auth:
        description: 构建 backend-java/micro-drama-gateway-auth（镜像 backend-micro-drama-gateway-auth，Traefik ForwardAuth）
        type: boolean
        default: true
      build_frontend:
        description: 构建 frontend 下工程（镜像 frontend-<项目目录名>）
        type: boolean
        default: true
      image_tag:
        description: 镜像 tag
        type: string
        default: "latest"
      skip_deploy_webhook:
        description: 跳过部署 Webhook（远端 deploy 异常时可勾选；镜像仍会构建并推送）
        type: boolean
        default: false

env:
  # 这些请配置在 GitHub Repository Variables（Settings → Secrets and variables → Actions → Variables）
  # - NEXUS_DOCKER_HOST: docker.dramadjbo.com
  # - NEXUS_URL: https://repo.dramadjbo.com
  # - DEPLOY_WEBHOOK_URL: https://deploy.dramadjbo.com/hooks/deploy
  # Webhook 若返回 5xx，多为部署端未注册 JSON 里 services 与 DEPLOY_SERVICE 一致、或 deploy 服务自身异常（与 curl 无关）。
  NEXUS_DOCKER_HOST: ${{ vars.NEXUS_DOCKER_HOST }}
  NEXUS_URL: ${{ vars.NEXUS_URL }}
  DEPLOY_WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      user: ${{ steps.filter.outputs.user }}
      content: ${{ steps.filter.outputs.content }}
      transcoder: ${{ steps.filter.outputs.transcoder }}
      video: ${{ steps.filter.outputs.video }}
      chain: ${{ steps.filter.outputs.chain }}
      payment: ${{ steps.filter.outputs.payment }}
      gateway_auth: ${{ steps.filter.outputs.gateway_auth }}
      frontend_admin: ${{ steps.filter.outputs.frontend_admin }}
      frontend_mini_app: ${{ steps.filter.outputs.frontend_mini_app }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 变更检测（按业务域/服务目录）
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            admin:
              - 'backend-java/micro-drama-admin/**'
              - 'backend-java/micro-drama-parent/**'
              - 'backend-java/micro-drama-common/**'
            user:
              - 'backend-java/micro-drama-user/**'
              - 'backend-java/micro-drama-parent/**'
              - 'backend-java/micro-drama-common/**'
            content:
              - 'backend-java/micro-drama-content/**'
              - 'backend-java/micro-drama-parent/**'
              - 'backend-java/micro-drama-common/**'
            transcoder:
              - 'backend-go/micro-drama-transcoder/**'
            video:
              - 'backend-go/micro-drama-video/**'
            chain:
              - 'backend-go/micro-drama-chain/**'
            payment:
              - 'backend-java/micro-drama-payment/**'
              - 'backend-java/micro-drama-parent/**'
              - 'backend-java/micro-drama-common/**'
            gateway_auth:
              - 'backend-java/micro-drama-gateway-auth/**'
              - 'backend-java/micro-drama-parent/**'
              - 'backend-java/micro-drama-common/**'
            frontend_admin:
              - 'frontend/micro-drama-admin/**'
            frontend_mini_app:
              - 'frontend/micro-drama-mini-app/**'

  backend-common:
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.admin == 'true' ||
      needs.changes.outputs.user == 'true' ||
      needs.changes.outputs.content == 'true' ||
      needs.changes.outputs.transcoder == 'true' ||
      needs.changes.outputs.chain == 'true' ||
      needs.changes.outputs.payment == 'true' ||
      needs.changes.outputs.gateway_auth == 'true'
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      - name: 生成 Maven 配置（直连中央仓库 + Nexus 仅用于私有 Snapshots）
        run: |
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>maven-releases</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>maven-snapshots</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>fast-build</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>nexus-snapshots</id>
                    <url>${{ env.NEXUS_URL }}/repository/maven-snapshots/</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>fast-build</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Maven 部署 — parent + common
        run: |
          set -e
          mvn -f backend-java/micro-drama-parent/pom.xml clean deploy -DskipTests
          mvn -f backend-java/micro-drama-common/pom.xml clean deploy -DskipTests

  build-admin:
    runs-on: ubuntu-latest
    needs: [changes, backend-common]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_admin == true) ||
      (github.event_name == 'push' && needs.changes.outputs.admin == 'true')
    env:
      IMAGE_NAME: backend-micro-drama-admin
      DEPLOY_SERVICE: backend-admin
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      - name: 生成 Maven 配置
        run: |
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>maven-releases</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>maven-snapshots</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Maven 部署 — micro-drama-admin
        run: |
          set -e
          mvn -f backend-java/micro-drama-common/pom.xml clean install -DskipTests
          # CI 中服务模块只需产出 jar 供镜像构建；不需要上传到 Nexus（避免大包触发 413）
          mvn -f backend-java/micro-drama-admin/pom.xml clean package -DskipTests

      - name: 配置 Docker 私服
        run: |
          echo "{\"insecure-registries\": [\"${{ env.NEXUS_DOCKER_HOST }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: 规范化 Docker 仓库地址
        run: |
          set -e
          echo "registry=${{ env.NEXUS_DOCKER_HOST }}" >> "$GITHUB_OUTPUT"

      - name: 登录 Nexus Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_DOCKER_HOST }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Docker build & push
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'latest' }}"
          REG="${{ env.NEXUS_DOCKER_HOST }}"
          cd backend-java/micro-drama-admin
          docker build -t "${REG}/${{ env.IMAGE_NAME }}:${TAG}" .
          docker push "${REG}/${{ env.IMAGE_NAME }}:${TAG}"

      - name: Webhook 部署
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy_webhook == false }}
        continue-on-error: true
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -e
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w "%{http_code}" -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
               -H "X-Deploy-Token: $DEPLOY_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{"services":"${{ env.DEPLOY_SERVICE }}"}')
          echo "Deploy webhook HTTP $code — response:"
          cat "$tmp" || true
          rm -f "$tmp"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook OK for ${{ env.DEPLOY_SERVICE }}"
            exit 0
          fi
          echo "::warning::Deploy webhook failed for ${{ env.DEPLOY_SERVICE }}（镜像已推送）。请核对部署端是否识别 services 名称并查看 deploy 服务日志。"
          exit 1

  build-user:
    runs-on: ubuntu-latest
    needs: [changes, backend-common]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_user == true) ||
      (github.event_name == 'push' && needs.changes.outputs.user == 'true')
    env:
      IMAGE_NAME: backend-micro-drama-user
      DEPLOY_SERVICE: backend-user
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      - name: 生成 Maven 配置
        run: |
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>maven-releases</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>maven-snapshots</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Maven 部署 — micro-drama-user
        run: |
          set -e
          mvn -f backend-java/micro-drama-common/pom.xml clean install -DskipTests
          # CI 中服务模块只需产出 jar 供镜像构建；不需要上传到 Nexus（避免大包触发 413）
          mvn -f backend-java/micro-drama-user/pom.xml clean package -DskipTests

      - name: 配置 Docker 私服
        run: |
          echo "{\"insecure-registries\": [\"${{ env.NEXUS_DOCKER_HOST }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: 规范化 Docker 仓库地址
        run: |
          set -e
          echo "registry=${{ env.NEXUS_DOCKER_HOST }}" >> "$GITHUB_OUTPUT"

      - name: 登录 Nexus Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_DOCKER_HOST }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Docker build & push
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'latest' }}"
          REG="${{ env.NEXUS_DOCKER_HOST }}"
          cd backend-java/micro-drama-user
          docker build -t "${REG}/${{ env.IMAGE_NAME }}:${TAG}" .
          docker push "${REG}/${{ env.IMAGE_NAME }}:${TAG}"

      - name: Webhook 部署
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy_webhook == false }}
        continue-on-error: true
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -e
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w "%{http_code}" -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
               -H "X-Deploy-Token: $DEPLOY_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{"services":"${{ env.DEPLOY_SERVICE }}"}')
          echo "Deploy webhook HTTP $code — response:"
          cat "$tmp" || true
          rm -f "$tmp"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook OK for ${{ env.DEPLOY_SERVICE }}"
            exit 0
          fi
          echo "::warning::Deploy webhook failed for ${{ env.DEPLOY_SERVICE }}（镜像已推送）。请核对部署端是否识别 services 名称并查看 deploy 服务日志。"
          exit 1

  build-content:
    runs-on: ubuntu-latest
    needs: [changes, backend-common]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_content == true) ||
      (github.event_name == 'push' && needs.changes.outputs.content == 'true')
    env:
      IMAGE_NAME: backend-micro-drama-content
      DEPLOY_SERVICE: backend-content
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      - name: 生成 Maven 配置
        run: |
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>maven-releases</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>maven-snapshots</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          XML

      # 先 install 本仓库的 common，避免仅构建 content 时从 ~/.m2 或 Nexus 拉到与当前 proto 不一致的旧 SNAPSHOT
      - name: Maven 部署 — micro-drama-content
        run: |
          set -e
          mvn -f backend-java/micro-drama-common/pom.xml clean install -DskipTests
          # CI 中服务模块只需产出 jar 供镜像构建；不需要上传到 Nexus（避免大包触发 413）
          mvn -f backend-java/micro-drama-content/pom.xml clean package -DskipTests

      - name: 配置 Docker 私服
        run: |
          echo "{\"insecure-registries\": [\"${{ env.NEXUS_DOCKER_HOST }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: 规范化 Docker 仓库地址
        run: |
          set -e
          echo "registry=${{ env.NEXUS_DOCKER_HOST }}" >> "$GITHUB_OUTPUT"

      - name: 登录 Nexus Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_DOCKER_HOST }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Docker build & push
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'latest' }}"
          REG="${{ env.NEXUS_DOCKER_HOST }}"
          cd backend-java/micro-drama-content
          docker build -t "${REG}/${{ env.IMAGE_NAME }}:${TAG}" .
          docker push "${REG}/${{ env.IMAGE_NAME }}:${TAG}"

      - name: Webhook 部署
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy_webhook == false }}
        continue-on-error: true
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -e
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w "%{http_code}" -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
               -H "X-Deploy-Token: $DEPLOY_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{"services":"${{ env.DEPLOY_SERVICE }}"}')
          echo "Deploy webhook HTTP $code — response:"
          cat "$tmp" || true
          rm -f "$tmp"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook OK for ${{ env.DEPLOY_SERVICE }}"
            exit 0
          fi
          echo "::warning::Deploy webhook failed for ${{ env.DEPLOY_SERVICE }}（镜像已推送）。请核对部署端是否识别 services 名称并查看 deploy 服务日志。"
          exit 1

  build-transcoder:
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_transcoder == true) ||
      (github.event_name == 'push' && needs.changes.outputs.transcoder == 'true')
    env:
      IMAGE_NAME: backend-micro-drama-transcoder
      DEPLOY_SERVICE: backend-transcoder
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go 编译校验
        working-directory: backend-go/micro-drama-transcoder
        run: |
          go mod download
          go build -o /dev/null ./cmd/transcoder

      - name: 配置 Docker 私服
        run: |
          echo "{\"insecure-registries\": [\"${{ env.NEXUS_DOCKER_HOST }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: 规范化 Docker 仓库地址
        run: |
          set -e
          echo "registry=${{ env.NEXUS_DOCKER_HOST }}" >> "$GITHUB_OUTPUT"

      - name: 登录 Nexus Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_DOCKER_HOST }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Docker build & push
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'latest' }}"
          REG="${{ env.NEXUS_DOCKER_HOST }}"
          cd backend-go/micro-drama-transcoder
          docker build -t "${REG}/${{ env.IMAGE_NAME }}:${TAG}" .
          docker push "${REG}/${{ env.IMAGE_NAME }}:${TAG}"

      - name: Webhook 部署
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy_webhook == false }}
        continue-on-error: true
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -e
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w "%{http_code}" -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
               -H "X-Deploy-Token: $DEPLOY_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{"services":"${{ env.DEPLOY_SERVICE }}"}')
          echo "Deploy webhook HTTP $code — response:"
          cat "$tmp" || true
          rm -f "$tmp"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook OK for ${{ env.DEPLOY_SERVICE }}"
            exit 0
          fi
          echo "::warning::Deploy webhook failed for ${{ env.DEPLOY_SERVICE }}（镜像已推送）。请核对部署端是否识别 services 名称并查看 deploy 服务日志。"
          exit 1

  build-video:
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_video == true) ||
      (github.event_name == 'push' && needs.changes.outputs.video == 'true')
    env:
      IMAGE_NAME: backend-micro-drama-video
      DEPLOY_SERVICE: backend-video
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 打印构建版本信息（排查 go.mod / commit）
        run: |
          set -e
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          echo "---- backend-go/micro-drama-video/go.mod (first 8 lines) ----"
          head -n 8 backend-go/micro-drama-video/go.mod

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go 编译校验
        working-directory: backend-go/micro-drama-video
        run: |
          go mod download
          go build -o /dev/null ./cmd/video-api

      - name: 配置 Docker 私服
        run: |
          echo "{\"insecure-registries\": [\"${{ env.NEXUS_DOCKER_HOST }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: 规范化 Docker 仓库地址
        run: |
          set -e
          echo "registry=${{ env.NEXUS_DOCKER_HOST }}" >> "$GITHUB_OUTPUT"

      - name: 登录 Nexus Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NEXUS_DOCKER_HOST }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Docker build & push
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'latest' }}"
          REG="${{ env.NEXUS_DOCKER_HOST }}"
          cd backend-go/micro-drama-video
          docker build -t "${REG}/${{ env.IMAGE_NAME }}:${TAG}" .
          docker push "${REG}/${{ env.IMAGE_NAME }}:${TAG}"

      - name: Webhook 部署
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy_webhook == false }}
        continue-on-error: true
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -e
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w "%{http_code}" -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
               -H "X-Deploy-Token: $DEPLOY_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{"services":"${{ env.DEPLOY_SERVICE }}"}')
          echo "Deploy webhook HTTP $code — response:"
          cat "$tmp" || true
          rm -f "$tmp"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook OK for ${{ env.DEPLOY_SERVICE }}"
            exit 0
          fi
